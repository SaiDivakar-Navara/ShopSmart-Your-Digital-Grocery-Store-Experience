
name: ShopSmart CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: shopsmart-eks-cluster
  AWS_ACCOUNT_ID: "196659290647"
  ECR_BACKEND_REPOSITORY: shopsmart-backend
  ECR_FRONTEND_REPOSITORY: shopsmart-frontend

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests: build only, without AWS authentication
      - name: Build Backend Image (Pull Request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./Project files/Backend
          file: ./Project files/Backend/dockerfile
          push: false
          tags: shopsmart-backend:ci

      - name: Build Frontend Image (Pull Request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./Project files/Frontend
          file: ./Project files/Frontend/dockerfile
          push: false
          tags: shopsmart-frontend:ci

      # Push to main: authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image to AWS ECR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./Project files/Backend
          file: ./Project files/Backend/dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/shopsmart-backend:${{ github.sha }}-${{ github.run_attempt }}

      - name: Build and Push Frontend Image to AWS ECR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./Project files/Frontend
          file: ./Project files/Frontend/dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/shopsmart-frontend:${{ github.sha }}-${{ github.run_attempt }}

  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Update Backend Deployment
        run: |
          kubectl set image deployment/shopsmart-backend \
            "*=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND_REPOSITORY}:${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"

      - name: Update Frontend Deployment
        run: |
          kubectl set image deployment/shopsmart-frontend \
            "*=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND_REPOSITORY}:${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"

      - name: Verify Backend Rollout
        run: |
          kubectl rollout status deployment/shopsmart-backend --timeout=180s

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status deployment/shopsmart-frontend --timeout=180s
