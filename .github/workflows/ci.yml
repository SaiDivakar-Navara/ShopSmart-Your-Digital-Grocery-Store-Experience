name: ShopSmart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Project files/Backend
          file: ./Project files/Backend/dockerfile
          push: false
          tags: shopsmart-backend:ci

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Project files/Frontend
          file: ./Project files/Frontend/dockerfile
          push: false
          tags: shopsmart-frontend:ci
