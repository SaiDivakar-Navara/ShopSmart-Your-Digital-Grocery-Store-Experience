
name: ShopSmart CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "helm/**"
      - "README.md"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "196659290647"

  ECR_BACKEND_REPOSITORY: shopsmart-backend
  ECR_FRONTEND_REPOSITORY: shopsmart-frontend

  HELM_VALUES_FILE: Helm/values.yaml

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    # Build and push images only on main branch push.
    # Pull requests will not authenticate to AWS.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: image-tag
        run: |
          echo "tag=${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # AWS authentication using GitHub OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and Push Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Project files/Backend
          file: ./Project files/Backend/dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}

      # Build and Push Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Project files/Frontend
          file: ./Project files/Frontend/dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}

  update-helm-chart:
    name: Update Helm Chart Image Tags
    runs-on: ubuntu-latest

    needs: build-and-push

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Helm Values
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          sed -i \
            "s|^    tag:.*|    tag: \"${NEW_TAG}\"|" \
            "$HELM_VALUES_FILE"

          echo "Updated image tags:"
          grep -n "tag:" "$HELM_VALUES_FILE"

          # Fail if the image tags were not updated
          if grep -q 'tag: "initial"' "$HELM_VALUES_FILE"; then
            echo "ERROR: Image tags were not updated!"
            exit 1
          fi

          echo "Helm values updated successfully."

      - name: Commit and Push Helm Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$HELM_VALUES_FILE"

          if git diff --cached --quiet; then
            echo "No Helm changes to commit."
            exit 0
          fi

          git commit -m "Update ShopSmart image tags to ${GITHUB_SHA} [skip ci]"
          git push origin main
