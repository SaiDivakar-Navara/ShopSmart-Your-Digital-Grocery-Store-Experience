services:
  frontend:
    image: saidivakar/myproject-frontend:latest
    container_name: mern-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: saidivakar/myproject-backend:latest
    container_name: mern-backend
    ports:
      - "5100:5100"
    environment:
      PORT: 5100
      MONGODB_URI: mongodb://mongodb:27017/mernapp
    depends_on:
      - mongodb
    networks:
      - app-network
