services:

  frontend:
    build:
      context: ./Frontend
    container_name: mern-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./Backend
    container_name: mern-backend
    ports:
      - "5100:5100"
    environment:
      PORT: 5100
      MONGODB_URI: mongodb://mongodb:27017/mernapp
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:8
    container_name: mern-mongodb
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data: