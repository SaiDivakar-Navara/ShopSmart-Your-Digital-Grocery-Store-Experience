apiVersion: apps/v1
kind: Deployment

metadata:
  name: shopsmart-backend
  labels:
    app: shopsmart-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shopsmart-backend

  template:
    metadata:
      labels:
        app: shopsmart-backend

    spec:
      containers:
      - name: shopsmart-backend

        image: 196659290647.dkr.ecr.us-east-1.amazonaws.com/shopsmart-backend:1d0bd954d8b910df8aa55a1e64201176c1f9ab07-1

        ports:
        - containerPort: 5100

        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: shopsmart-backend-secret
              key: MONGODB_URI

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: shopsmart-backend-secret
              key: JWT_SECRET

        - name: PORT
          value: "5100"