apiVersion: apps/v1
kind: Deployment

metadata:
  name: shopsmart-backend
  labels:
    app: shopsmart-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shopsmart-backend

  template:
    metadata:
      labels:
        app: shopsmart-backend

    spec:
      containers:
      - name: shopsmart-backend

        image: saidivakar/shopsmart-backend:latest

        ports:
        - containerPort: 5100

        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: shopsmart-backend-secret
              key: MONGO_URI

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: shopsmart-backend-secret
              key: JWT_SECRET

        - name: PORT
          value: "5100"