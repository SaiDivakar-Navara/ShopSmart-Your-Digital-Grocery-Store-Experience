apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsmart-frontend
  labels:
    app: shopsmart-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopsmart-frontend
  template:
    metadata:
      labels:
        app: shopsmart-frontend
    spec:
      containers:
      - name: shopsmart-frontend
        image: 196659290647.dkr.ecr.us-east-1.amazonaws.com/shopsmart-frontend:1d0bd954d8b910df8aa55a1e64201176c1f9ab07-1
        ports:
        - containerPort: 80